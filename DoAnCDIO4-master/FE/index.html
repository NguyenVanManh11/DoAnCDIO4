<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee Journey - Hệ thống quán cà phê thông minh</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coffee-bg': '#f7f4e9',
                        'coffee-grid': '#e8e5d6',
                        'coffee-green': '#307848',
                        'coffee-yellow': '#dfb252',
                        'coffee-dark': '#3b2c25',
                        'coffee-cup': '#f3e1a9'
                    },
                    fontFamily: {
                        'sans': ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
</head>
<body class="font-sans text-coffee-dark no-scrollbar bg-coffee-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATA ---
        const DUMMY_USER = { NguoiDungID: 1, TenDangNhap: 'khachhang', MatKhau: '123', HoTen: 'Nguyễn Văn Khách', HangThanhVienID: 2, TenHang: 'Gold', TongDiem: 1250, GiamGia: 5, SoDienThoai: '0987654321', DiaChi: '123 Đường Cà Phê, Quận 1' };
        
        const CATEGORIES = [{ id: 1, name: 'Cà Phê' }, { id: 2, name: 'Trà' }, { id: 3, name: 'Bánh' }];
        
        const MOCK_PRODUCTS = [
            { SanPhamID: 1, DanhMucID: 1, TenSanPham: 'CÀ PHÊ ĐEN TRUYỀN THỐNG', MoTa: 'Hương vị nguyên bản.', Gia: 25000, icon: 'fa-mug-hot' },
            { SanPhamID: 2, DanhMucID: 1, TenSanPham: 'BẠC XỈU ĐÁ', MoTa: 'Sự kết hợp hoàn hảo.', Gia: 30000, icon: 'fa-mug-saucer' },
            { SanPhamID: 5, DanhMucID: 1, TenSanPham: 'ESPRESSO Ý', MoTa: 'Đậm đà, bừng tỉnh.', Gia: 35000, icon: 'fa-mug-hot' },
            { SanPhamID: 3, DanhMucID: 2, TenSanPham: 'TRÀ ĐÀO CAM SẢ', MoTa: 'Thanh mát giải nhiệt.', Gia: 40000, icon: 'fa-glass-water' },
            { SanPhamID: 6, DanhMucID: 2, TenSanPham: 'TRÀ VẢI THIỀU TỨ XUYÊN', MoTa: 'Vị ngọt thanh dịu nhẹ.', Gia: 45000, icon: 'fa-leaf' },
            { SanPhamID: 4, DanhMucID: 3, TenSanPham: 'BÁNH CROISSANT', MoTa: 'Bánh sừng bò nướng bơ.', Gia: 35000, icon: 'fa-cookie' },
            { SanPhamID: 7, DanhMucID: 3, TenSanPham: 'TIRAMISU', MoTa: 'Béo ngậy hương cà phê.', Gia: 45000, icon: 'fa-cake-candles' },
        ];
        
        const SIZES = [{ id: 'S', name: 'Size S', price: 0 }, { id: 'M', name: 'Size M', price: 5000 }, { id: 'L', name: 'Size L', price: 10000 }];
        const TOPPINGS = [{ id: 1, name: 'Trân châu đen', price: 5000 }, { id: 2, name: 'Kem Macchiato', price: 10000 }];
        const VOUCHERS = [{ code: 'GIAM10K', discount: 10000, type: 'TienMat' }];

        // --- COMPONENTS ---

        // 1. Modal Đăng Nhập
        const AuthModal = ({ onClose, onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (username === DUMMY_USER.TenDangNhap && password === DUMMY_USER.MatKhau) onLogin(DUMMY_USER);
                else setError('Sai tên đăng nhập hoặc mật khẩu!');
            };

            return (
                <div className="fixed inset-0 bg-coffee-dark/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="glass-effect p-8 md:p-10 rounded-[2.5rem] relative max-w-md w-full shadow-2xl">
                        <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full text-size-1 font-black text-gray-500 hover:text-coffee-dark">&times;</button>
                        <h2 className="text-size-2 font-black text-coffee-green mb-6 text-center uppercase tracking-tighter">Đăng Nhập</h2>
                        
                        {error && <p className="text-red-500 mb-4 text-size-1 font-bold text-center">{error}</p>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-size-1 font-bold mb-1 ml-2 text-gray-700">Tên đăng nhập</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full p-4 rounded-2xl bg-white/80 border border-white text-size-1 font-bold outline-none focus:ring-2 focus:ring-coffee-green" required />
                            </div>
                            <div>
                                <label className="block text-size-1 font-bold mb-1 ml-2 text-gray-700">Mật khẩu</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-4 rounded-2xl bg-white/80 border border-white text-size-1 font-bold outline-none focus:ring-2 focus:ring-coffee-green" required />
                            </div>
                            <button type="submit" className="w-full bg-coffee-green text-white font-black text-size-1 py-4 rounded-full shadow-lg hover:-translate-y-1 transition-transform uppercase tracking-widest mt-4">Vào Quán</button>
                        </form>
                    </div>
                </div>
            );
        };

        // 2. Modal Đánh Giá (Review)
        const ReviewModal = ({ order, item, onClose, onSubmit }) => {
            const [rating, setRating] = useState(5);
            const [hoverRating, setHoverRating] = useState(0);
            const [comment, setComment] = useState('');

            if (!item) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(order.id, item.SanPhamID, { rating, comment });
            };

            return (
                <div className="fixed inset-0 bg-coffee-dark/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="glass-effect p-8 rounded-[2.5rem] relative max-w-md w-full shadow-2xl">
                        <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full text-size-1 font-black text-gray-500 hover:text-coffee-dark">&times;</button>
                        <h2 className="text-size-2 font-black text-coffee-dark uppercase tracking-tighter mb-2 text-center">Đánh Giá</h2>
                        <p className="text-size-1 font-bold text-gray-500 text-center mb-8">
                            Món <span className="text-coffee-green font-black">{item.TenSanPham}</span> (Đơn {order.id})
                        </p>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="flex justify-center gap-3">
                                {[1, 2, 3, 4, 5].map(star => (
                                    <button key={star} type="button" onMouseEnter={() => setHoverRating(star)} onMouseLeave={() => setHoverRating(0)} onClick={() => setRating(star)} className="text-size-2 hover:scale-110 transition-transform focus:outline-none">
                                        <i className={`fa-star ${star <= (hoverRating || rating) ? 'fa-solid text-coffee-yellow drop-shadow-md' : 'fa-regular text-gray-300'}`}></i>
                                    </button>
                                ))}
                            </div>
                            <div>
                                <textarea rows="4" value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Cảm nhận của bạn..." className="w-full p-4 rounded-2xl bg-white/80 border border-white text-size-1 font-medium text-gray-700 outline-none focus:ring-2 focus:ring-coffee-green resize-none"></textarea>
                            </div>
                            <button type="submit" className="w-full bg-coffee-green text-white font-black text-size-1 py-4 rounded-full shadow-lg hover:-translate-y-1 transition-transform uppercase tracking-widest">Gửi Đánh Giá</button>
                        </form>
                    </div>
                </div>
            );
        };

        // 3. Modal Chọn Sản Phẩm (Size, Topping)
        const ProductModal = ({ product, onClose, onAddToCart }) => {
            const [size, setSize] = useState(SIZES[0]);
            const [selectedToppings, setSelectedToppings] = useState([]);
            const [qty, setQty] = useState(1);

            if (!product) return null;

            const isCake = product.DanhMucID === 3;
            const toggleTopping = (t) => {
                if (selectedToppings.find(item => item.id === t.id)) setSelectedToppings(selectedToppings.filter(item => item.id !== t.id));
                else setSelectedToppings([...selectedToppings, t]);
            };

            const toppingTotal = selectedToppings.reduce((sum, t) => sum + t.price, 0);
            const total = ((product.Gia + size.price + toppingTotal) * qty);

            const handleAdd = () => {
                onAddToCart({
                    ...product,
                    cartId: Date.now(), 
                    selectedSize: isCake ? null : size,
                    selectedToppings: selectedToppings,
                    quantity: qty,
                    finalPrice: product.Gia + (isCake ? 0 : size.price) + toppingTotal
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-coffee-dark/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                    <div className="glass-effect p-8 rounded-[2.5rem] relative max-w-lg w-full max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl border border-white">
                        <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full text-size-1 font-black text-gray-500 hover:text-coffee-dark">&times;</button>
                        
                        <div className="flex items-center gap-4 mb-6 border-b-2 border-white/50 pb-6">
                            <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center text-size-2 text-coffee-green shadow-sm shrink-0">
                                <i className={`fa-solid ${product.icon}`}></i>
                            </div>
                            <div>
                                <h2 className="text-size-1 font-black text-coffee-green uppercase">{product.TenSanPham}</h2>
                                <p className="text-size-1 text-gray-600 font-bold">{product.Gia.toLocaleString('vi-VN')} đ</p>
                            </div>
                        </div>

                        {!isCake && (
                            <>
                                <div className="mb-6">
                                    <p className="text-size-1 font-black uppercase mb-3 text-gray-700 ml-2">Chọn Size</p>
                                    <div className="grid grid-cols-3 gap-2">
                                        {SIZES.map(s => (
                                            <button key={s.id} onClick={() => setSize(s)} className={`p-3 rounded-2xl text-size-1 font-bold border transition-all ${size.id === s.id ? 'bg-coffee-green text-white border-coffee-green shadow-md' : 'bg-white/70 border-white hover:bg-white text-gray-600'}`}>
                                                {s.name} <br/><span className="opacity-80">(+{s.price.toLocaleString()}đ)</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="mb-6">
                                    <p className="text-size-1 font-black uppercase mb-3 text-gray-700 ml-2">Thêm Topping</p>
                                    <div className="space-y-2">
                                        {TOPPINGS.map(t => (
                                            <label key={t.id} className="flex items-center gap-3 p-4 rounded-2xl bg-white/70 border border-white cursor-pointer hover:bg-white transition-all shadow-sm">
                                                <input type="checkbox" className="w-6 h-6 accent-coffee-green" checked={!!selectedToppings.find(item => item.id === t.id)} onChange={() => toggleTopping(t)} />
                                                <span className="text-size-1 font-bold flex-1 text-gray-700">{t.name}</span>
                                                <span className="text-size-1 font-black text-coffee-green">+{t.price.toLocaleString()}đ</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            </>
                        )}

                        <div className="flex items-center justify-between mb-8 bg-white/70 p-4 rounded-2xl border border-white">
                            <p className="text-size-1 font-black uppercase text-gray-700 ml-2">Số lượng</p>
                            <div className="flex items-center bg-gray-100 rounded-full p-1 shadow-inner">
                                <button onClick={() => setQty(Math.max(1, qty - 1))} className="w-10 h-10 rounded-full bg-white text-size-1 font-black hover:text-coffee-green shadow-sm">-</button>
                                <span className="w-12 text-center text-size-1 font-black">{qty}</span>
                                <button onClick={() => setQty(qty + 1)} className="w-10 h-10 rounded-full bg-white text-size-1 font-black hover:text-coffee-green shadow-sm">+</button>
                            </div>
                        </div>

                        <button onClick={handleAdd} className="w-full py-4 bg-coffee-yellow text-coffee-dark font-black text-size-1 rounded-full shadow-lg hover:-translate-y-1 transition-transform uppercase tracking-widest">
                            Thêm vào giỏ - {total.toLocaleString('vi-VN')} đ
                        </button>
                    </div>
                </div>
            );
        };

        // 4. Panel Giỏ Hàng (2 cột)
        const CartPanel = ({ isOpen, onClose, cart, removeFromCart, checkout, user }) => {
            const [orderType, setOrderType] = useState('Tại Quán');
            const [voucher, setVoucher] = useState('');
            const [discount, setDiscount] = useState(0);
            
            const [phone, setPhone] = useState('');
            const [address, setAddress] = useState('');

            useEffect(() => {
                if (user) {
                    setPhone(user.SoDienThoai || '');
                    setAddress(user.DiaChi || '');
                }
            }, [user, isOpen]);

            if (!isOpen) return null;

            const subTotal = cart.reduce((sum, item) => sum + (item.finalPrice * item.quantity), 0);
            const userDiscount = user ? (subTotal * user.GiamGia / 100) : 0;
            const finalTotal = Math.max(0, subTotal - userDiscount - discount);

            const handleApplyVoucher = () => {
                const found = VOUCHERS.find(v => v.code === voucher.toUpperCase());
                if (found) setDiscount(found.discount); else setDiscount(0);
            };
            
            const isCheckoutDisabled = cart.length === 0 || (orderType === 'Giao Hàng' && (!phone.trim() || !address.trim()));

            return (
                <div className="fixed inset-0 z-[55] flex items-center justify-center p-2 sm:p-6">
                    <div className="absolute inset-0 bg-coffee-dark/60 backdrop-blur-md" onClick={onClose}></div>
                    
                    <div className="relative w-full max-w-5xl h-[95vh] md:h-auto md:max-h-[85vh] glass-effect rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border border-white">
                        <button onClick={onClose} className="absolute top-4 right-4 md:left-6 w-10 h-10 flex items-center justify-center bg-gray-100/80 backdrop-blur-sm rounded-full text-size-1 font-black text-gray-500 hover:text-coffee-dark z-20">&times;</button>

                        {/* Cột trái */}
                        <div className="flex-1 flex flex-col min-h-0 bg-white/40 border-r border-white/50">
                            <div className="p-6 pt-16 md:pt-6 md:pl-20 shrink-0">
                                <h2 className="text-size-2 font-black text-coffee-dark uppercase tracking-tighter mb-4">Giỏ Hàng</h2>
                                
                                <div className="flex gap-2 bg-white/60 p-2 rounded-full shadow-sm border border-white mb-2">
                                    {['Tại Quán', 'Mang Đi', 'Giao Hàng'].map(type => (
                                        <button key={type} onClick={() => setOrderType(type)} className={`flex-1 py-2 text-size-1 font-bold rounded-full transition-all ${orderType === type ? 'bg-coffee-green text-white shadow-md' : 'text-gray-600 hover:bg-white'}`}>{type}</button>
                                    ))}
                                </div>
                                
                                {/* Form Giao Hàng luôn hiện nếu chọn */}
                                {orderType === 'Giao Hàng' && (
                                    <div className="mt-2 p-3 bg-white/80 rounded-2xl border border-white shadow-sm space-y-2">
                                        <div className="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-gray-100 focus-within:ring-2 focus-within:ring-coffee-green">
                                            <i className="fa-solid fa-phone text-gray-400"></i>
                                            <input type="text" placeholder="SĐT người nhận..." value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-transparent border-none text-size-1 font-medium outline-none" />
                                        </div>
                                        <div className="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-gray-100 focus-within:ring-2 focus-within:ring-coffee-green">
                                            <i className="fa-solid fa-location-dot text-gray-400"></i>
                                            <input type="text" placeholder="Địa chỉ giao hàng..." value={address} onChange={e=>setAddress(e.target.value)} className="w-full bg-transparent border-none text-size-1 font-medium outline-none" />
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto no-scrollbar p-6 pt-0 md:pl-20">
                                {cart.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-400 opacity-50">
                                        <i className="fa-solid fa-basket-shopping text-size-2 mb-4"></i>
                                        <p className="text-size-1 font-bold">Chưa có món nào.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {cart.map((item) => (
                                            <div key={item.cartId} className="flex bg-white/80 p-4 rounded-2xl shadow-sm border border-white items-center gap-4">
                                                <div className="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center text-coffee-green shrink-0">
                                                    <i className={`fa-solid ${item.icon} text-size-1`}></i>
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-size-1 font-black text-coffee-dark truncate">{item.TenSanPham}</p>
                                                    <p className="text-size-1 font-medium text-gray-500">
                                                        {item.selectedSize ? `Size ${item.selectedSize.id}` : ''} 
                                                        {item.selectedToppings?.length > 0 ? ` + ${item.selectedToppings.map(t=>t.name).join(', ')}` : ''}
                                                    </p>
                                                    <p className="text-size-1 font-bold text-coffee-green">SL: {item.quantity} x {item.finalPrice.toLocaleString()}đ</p>
                                                </div>
                                                <button onClick={() => removeFromCart(item.cartId)} className="w-10 h-10 rounded-full bg-red-50 text-red-500 font-bold text-size-1 hover:bg-red-100 shrink-0"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Cột phải */}
                        <div className="w-full md:w-[40%] bg-white p-6 md:p-8 flex flex-col shrink-0">
                            <h3 className="text-size-1 font-black uppercase text-gray-400 tracking-widest mb-6">Thanh Toán</h3>
                            
                            <div className="flex gap-2 mb-6">
                                <input type="text" placeholder="Mã Voucher..." value={voucher} onChange={e=>setVoucher(e.target.value)} className="flex-1 p-4 rounded-2xl bg-gray-50 border border-gray-100 text-size-1 font-bold uppercase outline-none focus:ring-2 focus:ring-coffee-green"/>
                                <button onClick={handleApplyVoucher} className="bg-coffee-dark text-white px-6 rounded-2xl font-bold text-size-1 uppercase hover:bg-black transition-colors">Áp dụng</button>
                            </div>

                            <div className="space-y-4 mb-6 flex-1">
                                <div className="flex justify-between text-size-1 font-bold text-gray-600"><span>Tạm tính:</span><span>{subTotal.toLocaleString()}đ</span></div>
                                {user && <div className="flex justify-between text-size-1 font-bold text-coffee-green"><span>Hạng {user.TenHang} (-{user.GiamGia}%):</span><span>-{userDiscount.toLocaleString()}đ</span></div>}
                                {discount > 0 && <div className="flex justify-between text-size-1 font-bold text-coffee-green"><span>Voucher:</span><span>-{discount.toLocaleString()}đ</span></div>}
                            </div>
                            
                            <div className="pt-4 border-t-2 border-gray-100 border-dashed shrink-0">
                                <div className="flex justify-between items-end mb-4">
                                    <span className="text-size-1 font-black text-gray-400 uppercase tracking-widest">Tổng Cộng</span>
                                    <span className="text-coffee-green text-size-2 font-black leading-none">{finalTotal.toLocaleString()}đ</span>
                                </div>
                                <button 
                                    onClick={() => checkout(finalTotal, orderType, { phone, address })}
                                    disabled={isCheckoutDisabled}
                                    className={`w-full py-4 text-size-1 font-black uppercase tracking-widest rounded-full shadow-xl transition-all ${isCheckoutDisabled ? 'bg-gray-100 text-gray-300 shadow-none' : 'bg-coffee-green text-white hover:bg-green-800 hover:-translate-y-1'}`}
                                >
                                    {orderType === 'Giao Hàng' && (!phone || !address) ? 'Nhập Đủ TT Giao' : (user ? 'Xác Nhận Đặt' : 'Đăng Nhập Để Đặt')}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CÁC TRANG CHÍNH (VIEWS) ---

        // View 1: Trang chủ
        const HomeView = ({ onNavigate }) => (
            <main className="p-4 md:p-16 relative flex flex-col items-center text-center animate-fade-in w-full max-w-6xl mx-auto">
                <div className="absolute top-10 left-[10%] text-coffee-yellow text-size-2 opacity-80">✨</div>
                <div className="absolute bottom-20 right-[10%] text-coffee-yellow text-size-2 opacity-80">✨</div>

                <div className="glass-effect p-8 md:p-12 rounded-[3rem] shadow-2xl mt-8 w-full">
                    <h1 className="text-size-2 md:text-[4rem] font-black uppercase text-coffee-green tracking-tighter mb-6 leading-none">A JOURNEY<br/>THROUGH HISTORY</h1>
                    <p className="text-size-1 font-medium text-gray-600 max-w-3xl mx-auto leading-relaxed mb-8 text-justify md:text-center">
                        Khởii nguồn của cà phê bắt đầu từ nhiều thế kỷ trước tại cao nguyên Ethiopia. Kể từ đó, cà phê đã vượt qua các đại dương và đế chế, trở thành thức uống được yêu thích trên toàn thế giới. Quán cà phê trở thành trung tâm giao lưu văn hóa, ảnh hưởng đến những cuộc trò chuyện, chính trị và nghệ thuật.
                    </p>
                    <div className="flex gap-4 flex-wrap justify-center">
                        <button onClick={() => onNavigate('menu')} className="bg-coffee-yellow text-coffee-dark font-black text-size-1 py-4 px-10 rounded-full shadow-lg hover:-translate-y-1 transition-transform uppercase tracking-widest">Xem Thực Đơn</button>
                        <button onClick={() => onNavigate('booking')} className="bg-white text-coffee-green border-2 border-coffee-green font-black text-size-1 py-4 px-10 rounded-full shadow-lg hover:-translate-y-1 transition-transform uppercase tracking-widest">Đặt Bàn Ngay</button>
                    </div>
                </div>

                                    <i className="fa-solid fa-seedling text-size-2"></i>
                                </div>
                                <span className="text-size-2 font-black tracking-tighter text-coffee-green uppercase">Heritage</span>
                            </div>
                            
                            <div className="flex items-center space-x-2 bg-white/50 p-2 rounded-full shadow-sm overflow-x-auto no-scrollbar w-full md:w-auto">
                                {[{ id: 'home', label: 'Trang chủ' }, { id: 'menu', label: 'Thực đơn' }, { id: 'booking', label: 'Đặt bàn' }, { id: 'history', label: 'Lịch sử' }].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`text-size-1 font-black uppercase whitespace-nowrap px-6 py-2 rounded-full transition-all ${activeTab === tab.id ? 'bg-coffee-green text-white shadow-md' : 'text-gray-600 hover:bg-white'}`}>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex gap-2">
                                <button onClick={() => setCartOpen(true)} className="text-size-1 font-black bg-white text-coffee-dark px-6 py-3 rounded-full hover:bg-gray-50 transition-colors shadow-sm flex items-center gap-2 uppercase">
                                    <i className="fa-solid fa-basket-shopping text-coffee-green"></i> Giỏ ({cart.length})
                                </button>
                                {user ? (
                                    <button onClick={() => setActiveTab('profile')} className="text-size-1 font-black bg-coffee-dark text-white px-6 py-3 rounded-full hover:bg-black transition-colors shadow-sm flex items-center gap-2 uppercase">
                                        <i className="fa-solid fa-user text-coffee-yellow"></i> {user.HoTen.split(' ').pop()}
                                    </button>
                                ) : (
                                    <button onClick={() => setAuthModalOpen(true)} className="text-size-1 font-black bg-coffee-yellow text-coffee-dark px-6 py-3 rounded-full hover:-translate-y-1 transition-transform shadow-lg uppercase">
                                        Đăng Nhập
                                    </button>
                                )}
                            </div>
                        </nav>

                        {/* Thông báo Alert */}
                        {notification && (
                            <div className="fixed top-28 left-1/2 transform -translate-x-1/2 z-[80] bg-coffee-dark/90 backdrop-blur-md text-white text-size-1 font-bold py-3 px-8 rounded-full border border-coffee-yellow animate-bounce shadow-xl text-center w-max max-w-[90%]">
                                {notification}
                            </div>
                        )}

                        {/* Khu vực nội dung View */}
                        <div className="flex-1 relative z-10 w-full overflow-y-auto no-scrollbar scroll-smooth">
                            {activeTab === 'home' && <HomeView onNavigate={setActiveTab} />}
                            {activeTab === 'menu' && <MenuView onProductSelect={setSelectedProduct} />}
                            {activeTab === 'booking' && <BookingView user={user} showNotify={showNotify} onRequireLogin={()=>setAuthModalOpen(true)} />}
                            {activeTab === 'history' && <HistoryView user={user} orders={mockOrders} reviews={reviews} onOpenReview={(order, item) => setReviewingItem({order, item})} />}
                            {activeTab === 'profile' && <ProfileView user={user} onLogout={handleLogout} />}
                        </div>

                        {/* Footer */}
                        <footer className="bg-white/40 p-6 text-center z-20 mt-auto border-t border-white/50 backdrop-blur-md">
                            <p className="text-size-1 font-black uppercase tracking-widest text-coffee-dark mb-1">Heritage Coffee & Tea</p>
                            <p className="text-size-1 font-medium text-gray-500">Hệ thống quản lý thông minh 2026</p>
                        </footer>
                    </div>

                    {/* Modals nổi */}
                    {isAuthModalOpen && <AuthModal onClose={() => setAuthModalOpen(false)} onLogin={handleLogin} />}
                    {selectedProduct && <ProductModal product={selectedProduct} onClose={() => setSelectedProduct(null)} onAddToCart={handleAddToCart} />}
                    {reviewingItem && <ReviewModal order={reviewingItem.order} item={reviewingItem.item} onClose={() => setReviewingItem(null)} onSubmit={handleSubmitReview} />}
                    <CartPanel isOpen={isCartOpen} onClose={() => setCartOpen(false)} cart={cart} removeFromCart={removeFromCart} checkout={handleCheckout} user={user} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
